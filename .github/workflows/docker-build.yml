name: sip-agent

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'sip-agent/**'
      - '.github/workflows/docker-build.yml'
      - '.github/workflows/tests.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'sip-agent/**'
      - '.github/workflows/docker-build.yml'
      - '.github/workflows/tests.yml'
  release:
    types: [published, created, edited, prereleased]
env:
  # GitHub Container Registry (the only registry pushed to)
  GHCR_REPO: ghcr.io/${{ github.repository_owner }}/sip-agent

jobs:
  # Same unit + component tiers and ruff gate as tests.yml (called, not
  # copied). Nothing is built or published unless they pass.
  tests:
    uses: ./.github/workflows/tests.yml

  build:
    name: Build and Push sip-agent Docker Image
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      # - name: Log in to Docker Hub
      #   if: github.event_name != 'pull_request'
      #   uses: docker/login-action@v3
      #   with:
      #     username: ${{ secrets.DOCKERHUB_USERNAME }}
      #     password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.GHCR_REPO }}
          tags: |
            # Set latest tag for default branch
            type=raw,value=latest,enable={{is_default_branch}}
            # Tag with branch name
            type=ref,event=branch
            # Tag with PR number
            type=ref,event=pr
            # Tag with git tag (v1.0.0 -> 1.0.0)
            type=semver,pattern={{version}}
            # Tag with major.minor (v1.0.0 -> 1.0)
            type=semver,pattern={{major}}.{{minor}}
            # Tag with major (v1.0.0 -> 1)
            type=semver,pattern={{major}}
            # Tag with short SHA
            type=sha,prefix=sha-

      - name: Build and push (main/tags - push to registries)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: ./sip-agent/
          file: ./sip-agent/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha
            type=registry,ref=${{ env.GHCR_REPO }}:buildcache
          # Write both caches that cache-from reads (the registry buildcache
          # was read but never written before).
          cache-to: |
            type=gha,mode=max
            type=registry,ref=${{ env.GHCR_REPO }}:buildcache,mode=max

      # PRs: prove the image still builds, without pushing. amd64 only — the
      # arm64 leg runs PJSIP's build under QEMU and would take far longer; the
      # multi-arch build still runs on main/tags before anything is published.
      - name: Build only (pull request - no push)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: ./sip-agent/
          file: ./sip-agent/Dockerfile
          platforms: linux/amd64
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha
            type=registry,ref=${{ env.GHCR_REPO }}:buildcache

      - name: Generate build summary
        run: |
          echo "## Docker Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Platforms" >> $GITHUB_STEP_SUMMARY
          echo "- \`linux/amd64\` (x86_64)" >> $GITHUB_STEP_SUMMARY
          echo "- \`linux/arm64\` (ARM64/DGX Spark compatible)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Tags" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "### Registries" >> $GITHUB_STEP_SUMMARY
            echo "- GHCR: \`${{ env.GHCR_REPO }}\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "### Note" >> $GITHUB_STEP_SUMMARY
            echo "PR build (linux/amd64 only) - images not pushed to registries" >> $GITHUB_STEP_SUMMARY
          fi
# TLS terminator for Open WebUI on :8443 (self-signed; see tls/openssl.cnf).
# Open WebUI is started with --forwarded-allow-ips '*', so the X-Forwarded-*
# headers below are trusted and it builds https:// URLs correctly.
server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/tls/openwebui.crt;
    ssl_certificate_key /etc/nginx/tls/openwebui.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 0;          # file / knowledge uploads
    proxy_read_timeout 900s;         # long generations + websockets
    proxy_send_timeout 900s;
    proxy_buffering off;             # streaming chat responses

    location / {
        proxy_pass http://open-webui:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

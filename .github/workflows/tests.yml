name: tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
  # Reused by docker-build.yml so images are only built/published after the
  # tests pass.
  workflow_call:

jobs:
  test:
    name: Unit + component tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11: the documented target; 3.12: what the image actually runs
        # (ubuntu:24.04's python3).
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: sip-agent
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            sip-agent/requirements.txt
            sip-agent/requirements-test.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-test.txt ruff

      # Syntax-level lint only (undefined names, syntax errors) so the gate
      # stays strict but doesn't impose a style ruleset on the codebase.
      - name: Lint (ruff, error-level rules)
        run: ruff check --select E9,F63,F7,F82 src tests

      # The e2e tier needs the real docker-compose stack + GPU (DGX) and is
      # run manually; CI covers the pure and mock-service tiers.
      - name: Run unit + component tests
        run: pytest tests/unit tests/component -q

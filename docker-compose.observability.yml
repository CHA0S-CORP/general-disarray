# Observability Stack for SIP AI Assistant
# Include this file using: docker compose -f docker-compose.yml -f docker-compose.observability.yml up
#
# Components:
# - OpenTelemetry Collector: Receives traces, metrics, logs from services
# - Prometheus: Metrics storage and querying
# - Tempo: Distributed tracing backend
# - Loki: Log aggregation
# - Grafana: Visualization and dashboards
#
# Access (published on 127.0.0.1 only by default):
# - Grafana: http://localhost:${GRAFANA_PORT:-3000} — anonymous Viewer; log in
#   as admin (GRAFANA_ADMIN_PASSWORD, default admin -> forced change) to edit.
# - Prometheus: http://localhost:${PROMETHEUS_PORT:-9090}
# - Tempo: http://localhost:3200    - Loki: http://localhost:3100
#
# Exposure: none of these backends has authentication (Loki auth_enabled:
# false, Prometheus/Tempo/exporters are open), so their host ports bind to
# OBSERVABILITY_BIND_ADDRESS (default 127.0.0.1). Grafana binds to
# GRAFANA_BIND_ADDRESS (default 127.0.0.1); set it to 0.0.0.0 for LAN access
# only together with a real GRAFANA_ADMIN_PASSWORD. Container-to-container
# traffic (http://prometheus:9090 etc.) is unaffected by either setting.
# NOTE: open-webui (base compose) also defaults to host :3000 — set
# GRAFANA_PORT (or OPEN_WEBUI_PORT) if you run both.

services:
  # ===================
  # OpenTelemetry Collector
  # ===================
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.140.0
    container_name: otel-collector
    command: ["--config=/etc/otel-collector/config.yaml"]
    volumes:
      - ./observability/otel-collector/config.yaml:/etc/otel-collector/config.yaml:ro
    # ports:
    #   - "4317:4317"   # OTLP gRPC
    #   - "4318:4318"   # OTLP HTTP
    #   - "8888:8888"   # Prometheus metrics exposed by the collector
    #   - "13133:13133" # Health check endpoint
    depends_on:
      - tempo
      - loki
      - prometheus
    restart: unless-stopped
    # healthcheck:
    #   test: ["CMD", "curl", "-f", "http://localhost:13133/"]
    #   interval: 10s
    #   timeout: 5s
    #   retries: 3

  # ===================
  # Prometheus - Metrics
  # ===================
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yaml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-remote-write-receiver'
      - '--enable-feature=exemplar-storage'
      - '--enable-feature=native-histograms'
    volumes:
      - ./observability/prometheus/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - prometheus-data:/prometheus
    ports:
      # Host publish is parameterized so the stack can coexist with other
      # services on the box; in-cluster traffic uses http://prometheus:9090
      # regardless (that's what the GPU_STATUS / ALERTS tools query).
      - "${OBSERVABILITY_BIND_ADDRESS:-127.0.0.1}:${PROMETHEUS_PORT:-9090}:9090"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ===================
  # Tempo - Traces
  # ===================
  tempo:
    image: grafana/tempo:2.6.1
    container_name: tempo
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./observability/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "${OBSERVABILITY_BIND_ADDRESS:-127.0.0.1}:3200:3200"   # Tempo HTTP
      - "${OBSERVABILITY_BIND_ADDRESS:-127.0.0.1}:9095:9095"   # Tempo gRPC
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3200/ready"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ===================
  # Loki - Logs
  # ===================
  loki:
    image: grafana/loki:3.2.1
    container_name: loki
    user: "0"  # Run as root to avoid volume permission issues
    entrypoint:
      - sh
      - -c
      - |
        mkdir -p /var/loki/rules /var/loki/chunks
        exec /usr/bin/loki -config.file=/etc/loki/loki.yaml
    volumes:
      - ./observability/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/var/loki
    ports:
      - "${OBSERVABILITY_BIND_ADDRESS:-127.0.0.1}:3100:3100"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ===================
  # Grafana - Visualization
  # ===================
  grafana:
    image: grafana/grafana:11.3.0
    container_name: grafana
    environment:
      # Anonymous visitors can VIEW the provisioned dashboards only (was
      # Admin: anyone reaching the port could edit datasources/run queries).
      # Set GRAFANA_ANONYMOUS_ENABLED=false to require login for everything.
      - GF_AUTH_ANONYMOUS_ENABLED=${GRAFANA_ANONYMOUS_ENABLED:-true}
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      # Login form stays on so an admin can still sign in to edit.
      - GF_AUTH_DISABLE_LOGIN_FORM=false
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_FEATURE_TOGGLES_ENABLE=traceqlEditor
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL:-http://localhost:3000}
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_BIND_ADDRESS:-127.0.0.1}:${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
      - tempo
      - loki
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
  
  # ===================
  # Redis Exporter - Redis Metrics
  # ===================
  redis-exporter:
    image: oliver006/redis_exporter:v1.66.0
    container_name: redis-exporter
    environment:
      - REDIS_ADDR=redis://redis:6379
    ports:
      - "${OBSERVABILITY_BIND_ADDRESS:-127.0.0.1}:9121:9121"
    depends_on:
      - redis
    restart: unless-stopped

  # ===================
  # nvitop Exporter - GPU Metrics
  # ===================
  nvitop-exporter:
    image: ghcr.io/cha0s-corp/nvitop-exporter:latest
    # build:
    #   context: ./nvitop/
    #   dockerfile: nvitop-exporter/Dockerfile
    container_name: nvitop-exporter
    command: ["--port", "5050", "--bind-address", "0.0.0.0"]
    ports:
      - "${OBSERVABILITY_BIND_ADDRESS:-127.0.0.1}:5050:5050"
    pid: "host"  # Required to see GPU processes
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # healthcheck:
    #   test: ["CMD", "curl", "-f", "http://localhost:5050/metrics"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3
    #   start_period: 10s

  # ===================
  # Override sip-agent with OTEL instrumentation
  # ===================
  sip-agent:
    environment:
      # OpenTelemetry configuration
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_SERVICE_NAME=sip-agent
      - OTEL_RESOURCE_ATTRIBUTES=service.namespace=sip-ai,deployment.environment=docker
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_METRICS_EXPORTER=otlp
      - OTEL_LOGS_EXPORTER=otlp
      - OTEL_PYTHON_LOGGING_AUTO_INSTRUMENTATION_ENABLED=true
      # Enable OTEL in our app
      - OTEL_ENABLED=true
    # depends_on:
    #   otel-collector:
    #     condition: service_healthy

  # ===================
  # vLLM service: intentionally NOT overridden here.
  # ===================
  # The base `vllm` service now runs SGLang (sglang-ling-fp4:local, list-form
  # command with entrypoint []). This file used to replace its command with
  # vLLM flags (--model=..., --gpu-memory-utilization=...), which launched a
  # broken LLM server whenever the overlay was used. Prometheus already scrapes
  # vllm:8000/metrics (base command passes --enable-metrics). For SGLang
  # request tracing, append `--enable-trace` and
  # `--otlp-traces-endpoint=otel-collector:4317` to the base command instead
  # (check `python3 -m sglang.launch_server --help` in the image first).

  # ===================
  # Override Speaches with OTEL instrumentation
  # ===================
  speaches:
    environment:
      # OpenTelemetry for FastAPI auto-instrumentation
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
    depends_on:
      otel-collector:
        condition: service_started

volumes:
  prometheus-data:
  tempo-data:
  loki-data:
  grafana-data:
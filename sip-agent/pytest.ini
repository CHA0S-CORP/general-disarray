[pytest]
# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Make `src/` importable so tests can `from config import Config`, etc.,
# exactly as the app does at runtime.
pythonpath = src

# pytest-asyncio: let plain `async def test_*` run without a per-test marker.
asyncio_mode = auto

# Test tiers (select with `-m`):
#   unit      - pure, no I/O, no external services. Runs anywhere.
#   component - real agent code against in-process mock Speaches/vLLM + fakeredis.
#   e2e       - real docker-compose stack + real SIP calls (DGX only).
markers =
    unit: fast, pure unit tests (no network, no docker)
    component: in-process integration with mock external services
    e2e: real-stack end-to-end (requires docker compose + GPU/DGX)

addopts = -ra

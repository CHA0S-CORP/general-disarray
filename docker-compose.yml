# Docker Compose for SIP AI Assistant with Speaches (STT + TTS) + vLLM
# =====================================================================
# Optimized for GB10/Grace Blackwell with 100GB+ VRAM
#
# Services:
#   - vllm: LLM server (Llama 3.1 70B)
#   - speaches: Unified STT (Whisper) + TTS (Piper/Kokoro) server
#   - redis: Queue for outbound calls
#   - sip-agent: Main SIP application

services:
  # ============================================================================
  # Redis - Queue for outbound calls
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: sip-ai-redis
    command: redis-server --appendonly yes
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ============================================================================
  # LLM Server - Ling-3.0-flash-int4 on SGLang (replaced vLLM 2026-08-07)
  #
  # Was: vllm/vllm-openai:latest serving Qwen/Qwen3-30B-A3B-Instruct-2507-FP8
  #      at --gpu-memory-utilization 0.50 (~60 GiB).
  # Now: 124B total / 5.1B active, ~90 GiB. The service is still named `vllm`
  #      and still answers on http://vllm:8000 so sip-agent's LLM_BASE_URL and
  #      `depends_on: vllm` keep working unchanged. Only the engine changed.
  #
  # Runtime is SGLang, NOT vLLM: this is a BailingMoeV3 / bailing_hybrid model
  # that released vLLM builds do not register.
  #
  # THE IMAGE IS BUILT LOCALLY, from ~/code-llm/ling-fp4:
  #     docker build -t sglang-ling-fp4:local ~/code-llm/ling-fp4/
  # (The "fp4" in the tag is historical - the image is a patched SGLang, not a
  # checkpoint. See ~/code-llm/ling-fp4/README.md for the full story.) The int4
  # checkpoint here does not need that image's FP4 loader patch, but it does
  # benefit from its ling3 structural-tag patch, which is what makes
  # tool_choice="required" grammar-constrained instead of a free-for-all.
  #
  # THE THREE FLAGS BELOW ARE LOAD-BEARING - do not drop them:
  #   --disable-shared-experts-fusion  correctness
  #   --moe-runner-backend=triton      correctness
  #   --default-chat-template-kwargs   latency
  # Each is explained at its line. Verified working 2026-08-07.
  # ============================================================================
  vllm:
    image: sglang-ling-fp4:local        # built from ~/code-llm/ling-fp4 - see above
    container_name: sip-ai-vllm
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
    ipc: host
    shm_size: "32gb"                    # SGLang wants a large /dev/shm
    ulimits:
      memlock: -1
      stack: 67108864
    # This image's ENTRYPOINT is not a server, so spell out the full command.
    entrypoint: []
    # LIST form, not the folded "command: >" string form. Compose splits the
    # string form with shell-like rules and strips the inner double quotes from
    # the JSON below, turning {"enable_thinking":false} into
    # {enable_thinking:false} - which json.loads rejects, so the server refuses
    # to start. Keep this a list.
    command:
      - python3
      - -m
      - sglang.launch_server
      - --model-path=${LLM_MODEL_PATH:-inclusionAI/Ling-3.0-flash-int4}
      - --served-model-name=${LLM_MODEL:-ling-3.0-flash}
      - --host=0.0.0.0
      - --port=8000
      - --tp=1
      - --mem-fraction-static=${LLM_MEM_FRACTION:-0.74}
      - --context-length=${MAX_MODEL_LEN:-65536}
      # ---- quantisation-specific block: currently int4 --------------------
      # FP4 was put on this URL on 2026-08-08 and reverted the same day. It
      # passed every synthetic test (tool calls 8/8 on bare requests, code echo
      # ~3%, 40% faster decode) but produced degenerate output under real
      # OpenCode traffic. int4 has never done that in any test here.
      #
      # TO TRY FP4 AGAIN: set LLM_MODEL_PATH=inclusionAI/Ling-3.0-flash-fp4 in
      # .env and swap this block for:
      #     - --moe-runner-backend=flashinfer_mxfp4
      #     - --flashinfer-mxfp4-moe-precision=default
      #     - --disable-shared-experts-fusion
      #     - --enable-fp32-lm-head
      #     - --fp8-gemm-backend=cutlass
      # (all five required; the last three are from the vendor's model card).
      # FP4 also relies on a hand-added generation_config.json in the HF cache
      # setting temperature 0.2 - see ling-fp4/README.md in ~/code-llm.
      # Soak it against real traffic before trusting it, not just probes.
      # MARLIN TESTED AND REJECTED 2026-08-09. The original token soup was
      # caused by shared-experts fusion, not by Marlin, so Marlin was retested
      # with --disable-shared-experts-fusion: output was fine and acceptance was
      # healthy (2.37-2.82), but decode measured 9.0 tok/s vs triton's 26.3.
      # Marlin is simply not optimised for sm_121 here - same story as its 172 s
      # CUDA graph capture on FP4 (vs 5 s for flashinfer). Do not retry.
      - --moe-runner-backend=triton
      - --disable-shared-experts-fusion
      # FlashKDA prefill TESTED 2026-08-09: no gain (8.4/14.4/25.5/78.1s vs
      # triton's 7.3/14.8/25.3/77.9s at 15K/23K/32K/59K). The KDA layers are
      # not the prefill bottleneck.
      # Prefill scaling measures O(n^1.64) -> O(n^1.83) as context grows,
      # i.e. the 7 quadratic MLA layers dominate at long context. But no
      # better MLA kernel is available here: trtllm_mla dies with
      # "TllmGenFmhaRunner ... Unsupported architecture" on sm_121, and
      # flashinfer attention ties triton.
      #
      # KEEPER: bigger prefill chunks. Same total attention FLOPs, but fewer
      # passes and better GEMM shapes. Measured cold-prefill wait, 8K chunks
      # -> 32K chunks, confirmed over two runs:
      #     15K ctx   7.3s -> 5.8s   (-21%)
      #     24K ctx  14.8s -> 11.9s  (-20%)
      #     32K ctx  25.3s -> 15.8s  (-38%)
      #     59K ctx  77.9s -> 74.5s  (-4%, quadratic MLA dominates there)
      # Costs 0.4% of the KV pool (881,891 -> 878,702 tokens) and zero
      # request slots. Decode unchanged at 20.7 tok/s, correctness clean.
      # NOTE an earlier note in this file says 16384/32768 was 'tried and
      # reverted' as neutral - that test ran with NEXTN active, which
      # distorted it. Retested cleanly without NEXTN, it is a real win.
      - --chunked-prefill-size=32768
      - --max-prefill-tokens=65536
      # KDA kernel sweep 2026-08-09: 35 of 42 layers are KDA linear-attention,
      # so this is where the decode compute actually is. Baseline (triton):
      # median 20.7 tok/s.
      # NOTE: --linear-attn-backend accepts {triton,cutedsl,flashinfer,flashkda,
      # nvidia_kda,ptx_kda} but KDA *decode* only supports triton/cutedsl/
      # flashinfer - ptx_kda crashes the scheduler at startup with
      # "Unsupported KDA decode backend". flashkda is prefill-only.
      # KDA BACKEND SWEEP DONE 2026-08-09 - triton (the default) wins, so no
      # --linear-attn-backend flag is set. Measured medians, server metric:
      #   triton (default)            20.7   <- keep
      #   cutedsl                     19.8   (but 49 req slots vs 32)
      #   flashinfer decode + triton  20.7   (tie, extra flag for nothing)
      #   ptx_kda / nvidia_kda        crash: decode supports only
      #                               triton/cutedsl/flashinfer
      #   flashkda                    prefill-only
      # Correctness was clean (0/6 junk, 4/4 tools) on every variant.
      # torch.compile TESTED AND REJECTED 2026-08-09: compiled for 10+ min
      # emitting 152 'ttir analysis hit an op we do not know how to analyze:
      # tt.elementwise_inline_asm' failures (so it cannot even trace the
      # triton kernels this model relies on), and drove host MemAvailable to
      # 3 GiB - memwatch.sh killed it to protect the box. Do not enable.
      # KERNEL SWEEP COMPLETE 2026-08-09 - every alternative ties or loses to
      # SGLang's auto-selected defaults, so NO backend flags are set beyond
      # --moe-runner-backend=triton (which is a correctness requirement, not
      # a speed choice). Medians from SGLang's own gen-throughput metric:
      #
      #   defaults (triton everywhere)      20.7-20.8   <- ceiling
      #   flashinfer MLA attention          20.7-20.8   tie (n=93)
      #   flashinfer mamba backend          20.7-20.8   tie
      #   KDA flashinfer decode             20.7        tie
      #   KDA cutedsl                       19.8        worse (49 slots though)
      #   marlin MoE runner                  9.0        much worse
      #   NEXTN speculative decoding        11.0        SUPERSEDED - see below
      #   NEXTN + longer chain               7.1        SUPERSEDED - see below
      #   KDA ptx_kda / nvidia_kda          crash (decode unsupported)
      #   torch.compile                     OOM, watchdog killed it
      #
      # The two NEXTN rows above were remeasured 2026-08-17 and do not hold; the
      # rest of the sweep still stands. "~20.8 tok/s is this box's ceiling for
      # int4" was wrong: with NEXTN configured properly it is 33.8. See the
      # NEXTN block below.
      # SPECULATIVE TUNING, revised 2026-08-17. The 2026-08-09 note here said
      # SGLang's auto-chosen chain (steps=3/topk=1/draft=4) was already best and
      # to "leave the speculative parameters on auto". Half right: longer chains
      # ARE worse (a full steps/draft sweep confirms steps=5/draft=6 is the worst
      # arm tested), but auto is not the peak and the parameters must not be left
      # unset. Measured, SGLang's own gen-throughput metric, mem-fraction 0.88:
      #   steps1/draft2   32.66 tok/s   6 slots   accept len 1.79  rate 0.80
      #   steps2/draft3   33.77 tok/s   5 slots   accept len 2.24  rate 0.62  <-
      #   steps3/draft4   32.54 tok/s   2 slots   accept len 2.50  rate 0.50
      #   steps4/draft5   29.86 tok/s   3 slots   accept len 2.55  rate 0.39
      #   steps5/draft6   25.94 tok/s   4 slots   accept len 2.50  rate 0.30
      # Past draft=3 accept LENGTH still rises while accept RATE collapses: the
      # extra draft tokens get computed and thrown away. That is the mechanism
      # behind the old steps5/draft6 observation, and it is real.
      # The draft budget is the ONLY lever that pays. Also swept 2026-08-17 on
      # top of steps2/draft3, one knob per arm, all within ~3% BELOW baseline
      # and all three identical to each other on accept len/rate (i.e. they do
      # not move the decode path at all):
      #   baseline                          33.60 tok/s  ttft 0.194s
      #   --speculative-attention-mode=decode  32.73     ttft 0.196s
      #   --num-continuous-decode-steps=2      32.59     ttft 0.190s
      #   --scheduler-recv-interval=4          32.60     ttft 0.195s
      # Do not bother with these. (--num-continuous-decode-steps did NOT hurt
      # TTFT despite its docs - it just buys nothing.)
      # Speculative decoding via the checkpoint's built-in MTP layer. config
      # has num_nextn_predict_layers=1 and the weights carry 43 layers (0-42)
      # against num_hidden_layers=42, so layer 42 IS the draft layer. This is
      # the vendor model card's "recommended low-latency recipe". Decode is the
      # bottleneck for agent use here (int4 on the triton MoE runner is
      # ~14-18 tok/s), and MTP is the one lever that attacks it without
      # changing quantisation.
      # NEXTN / MTP SPECULATIVE DECODING: REJECTED 2026-08-09, OVERTURNED
      # 2026-08-17. It is worth 1.63x on single-stream decode.
      #
      #   no spec           20.67 tok/s   13 slots
      #   steps2/draft3     33.77 tok/s    5 slots   accept len 2.24
      #
      # both by SGLang's own gen-throughput line, same image, same box.
      #
      # WHY THE 2026-08-09 VERDICT WAS WRONG. Its reasoning was "this box is
      # compute-bound on the MoE, not memory-bound; speculation wins on
      # memory-bound decode". Neither half survives measurement:
      #   - Not compute-bound on the MoE. Summing the safetensors and scaling
      #     routed experts by num_experts_per_tok/num_experts = 8/512, int4
      #     touches 7.49 GB per decoded token, of which ATTENTION is ~60% and
      #     the 8 live experts only ~13%. At 273 GB/s that allows 36.4 tok/s
      #     and we measure ~20 - about 50% MBU.
      #   - The missing half is per-step overhead, and that is the regime
      #     speculation wins hardest in. Driving the live server:
      #       bs=1 20.2 | bs=2 46.4 (23.2/stream) | bs=4 90.2 (22.5/stream)
      #     A step carrying 4 tokens costs about what a step carrying 1 costs,
      #     so verifying k draft tokens is nearly free. Accept len 2.4-2.9
      #     should have yielded ~2.5x, and now does.
      # The old run almost certainly passed a bare --speculative-algorithm=NEXTN
      # and let the other three parameters default. Unset
      # --speculative-num-draft-tokens reaches allocation_sizing.py:26 as None
      # (max(spec_steps*spec_topk, spec_tokens)); a sibling bench script doing
      # exactly that died there with TypeError. PIN ALL FOUR PARAMETERS.
      #
      # STILL TRUE from the old note: the "26.3 tok/s" claim that predated it
      # was a client-side artifact. Speculative decoding delivers tokens in
      # bursts, so tokens/(total - ttft) over-states the rate. Judge only by
      # SGLang's own "gen throughput" log line.
      #
      # COSTS, and they are real:
      #   - Request slots 13 -> 5. KDA linear-attention state is 37.46 MB/req
      #     and the hybrid cache is sized against the draft budget. Fine for
      #     one phone call plus OpenCode; not fine for many concurrent callers.
      #     (Slot counts move +/-1 with load-time memory state.)
      #   - Needs --mem-fraction-static 0.85 -> 0.88. At 0.85 the server dies
      #     at startup with "Not enough GPU memory for hybrid (mamba/linear-
      #     attention) state cache. Computed max_mamba_cache_size=-6". 0.88 is
      #     still under the ~0.92 ceiling docker-compose.ablate.yml warns about.
      #     The no-spec baseline at 0.88 is 20.67, so mem-fraction alone does
      #     not move bs=1 decode.
      #   - NOT validated on tool-calling or long agent turns; accept len 2.24
      #     comes from a prose prompt. And LING_ABLATE_LAYERS=28:42 is half-open
      #     so the draft layer 42 is OUTSIDE it - an un-ablated draft proposing
      #     against an ablated target. Acceptance in refusal-adjacent territory
      #     is unmeasured. That interaction did not exist in 2026-08-09.
      #
      # Full analysis and sweep table: ling-fp4/README.md, "Speculative decoding
      # (NEXTN) on int4". To enable, uncomment ALL FOUR and raise mem-fraction:
      # - --speculative-algorithm=NEXTN
      # - --speculative-num-steps=2
      # - --speculative-eagle-topk=1
      # - --speculative-num-draft-tokens=3
      # (superseded: see the chunked-prefill KEEPER note below)
      # Longest-prefix-match beats fcfs when several agent sessions share the
      # box: it schedules to maximise radix cache reuse, and cache hits are the
      # difference between a 0.5 s turn and a 33 s one.
      - --schedule-policy=lpm
      # Let one session's prefill share a batch with another's decode instead
      # of alternating, so a long prefill does not stall other sessions.
      - --enable-mixed-chunk
      # Concurrency: max_running_requests was capped at 16 by the mamba state
      # cache (max_mamba_cache_size=80, 5 slots per request), not by KV. 35 of
      # this model's 42 layers are KDA linear-attention, so that recurrent
      # state is large - 5.54 GB ssm_state + 0.19 GB conv_state. bfloat16
      # halves it, which roughly doubles the request cap and hands the freed
      # memory back to the KV pool.
      - --mamba-ssm-dtype=bfloat16
      # Single-quoted so YAML treats the JSON as a scalar, not a flow mapping.
      - '--default-chat-template-kwargs={"enable_thinking": false}'
      - --reasoning-parser=ling3
      - --tool-call-parser=ling3
      - --chat-template=/opt/ling/chat_template.jinja
      - --trust-remote-code
    # ^ Why each of the non-obvious flags:
    #
    #   --moe-runner-backend triton
    #       Default 'auto' picks CompressedTensorsWNA16MarlinMoEMethod
    #       (GPTQ-Marlin), which loads without complaint on GB10 (sm_121) and
    #       then emits pure token soup - greedy "what is 2+2" returns
    #       " practically practically practically...".
    #
    #   --disable-shared-experts-fusion
    #       Same token-soup symptom from a different cause. This checkpoint
    #       leaves shared experts UNQUANTIZED (config.json `ignore` list) while
    #       routed experts are int4. SGLang fuses the shared expert into the
    #       routed-expert tensor by default and the int4 path has no handler
    #       for that mixed case, so it silently corrupts the weights.
    #
    #   --default-chat-template-kwargs {"enable_thinking":false}
    #       THIS IS THE ONE THAT MAKES IT USABLE ON A PHONE CALL. Ling is a
    #       thinking model, on by default. sip-agent is a generic OpenAI client
    #       and never sends chat_template_kwargs, so without this every turn
    #       generates reasoning tokens first - which are never spoken. Measured
    #       time to first *spoken* token, 728-token system prompt + 3 tools:
    #           thinking on : 1441 ms chit-chat, 3.66 s through a tool round
    #           thinking off:  173 ms chit-chat, 1.56 s through a tool round
    #       A per-request chat_template_kwargs still overrides this if some
    #       caller genuinely wants the reasoning path.
    #
    # NOTE: $VLLM_TOOL_ARGS, $VLLM_MAX_NUM_SEQS, $VLLM_MAX_NUM_BATCHED_TOKENS
    # and $VLLM_KV_CACHE_DTYPE are vLLM-only and are deliberately NOT passed
    # here; SGLang would reject them. They are commented out in .env.
    ports:
      # Host-side publish is parameterized so the stack can coexist with other
      # services on the box; in-cluster traffic uses http://vllm:8000 regardless.
      - "${VLLM_PORT:-8000}:8000"
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
      # Chat template with the tool-call placeholders replaced by a concrete
      # example; the stock one teaches the model to emit literal
      # "{arg-value-1}" and "...". See ~/code-llm/ling-fp4/README.md.
      - ./docker/ling/chat_template.jinja:/opt/ling/chat_template.jinja:ro
    healthcheck:
      # This image has no curl; use python3 like the rest of the SGLang stack.
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 30s
      timeout: 10s
      retries: 5
      # Was 300s for the 30B. Ling needs ~7 min (weights ~200s + Marlin/graph
      # capture). sip-agent gates on `condition: service_healthy`, so a
      # start_period shorter than the real load time would fail the stack.
      start_period: 2400s
    # If this ever runs away, make the OOM killer pick it before the desktop.
    # On GB10 the GPU allocates from the same 119 GiB as the OS, and driver
    # allocations are not charged to the process RSS, so the global OOM killer
    # cannot otherwise see the offender.
    oom_score_adj: 1000
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  # ============================================================================
  # LLM warmup - one-shot, exits immediately.
  #
  # The first request to a freshly started SGLang pays JIT/autotune cost for the
  # long-prompt-with-tools kernel shapes. Measured with the real ~3.3K-token,
  # 29-tool sip-agent turn: 35.6 s cold vs ~1-2 s warm. sip-agent's
  # LLM_AGENT_TIMEOUT_S is 30, so WITHOUT this the first caller after a restart
  # or reboot times out and gets nothing.
  #
  # Uses the SGLang image only because it is already on the box and has python3
  # - it runs a ~2 KB script, not a model. Failures are ignored by design; a
  # warmup must never keep the stack down.
  # ============================================================================
  llm-warmup:
    image: sglang-ling-fp4:local
    container_name: sip-ai-llm-warmup
    restart: "no"
    depends_on:
      vllm:
        condition: service_healthy
    environment:
      - LLM_WARMUP_URL=http://vllm:8000/v1
      - LLM_MODEL=${LLM_MODEL:-ling-3.0-flash}
    entrypoint: ["python3", "/opt/ling/warmup.py"]
    volumes:
      - ./docker/ling/warmup.py:/opt/ling/warmup.py:ro

  # ============================================================================
  # Open WebUI - browser chat front-end for the same Ling the phone bot uses.
  #
  # Cloned from ~/llm-sc-1 on 2026-08-08. Its data volume was copied across, so
  # existing chats/users/settings carry over (llm-sc-1_open-webui ->
  # general-disarray_open-webui). Stop the llm-sc-1 one before starting this;
  # they both want host port 8080 and both would write their own copy of the DB.
  #
  # Rewired for this stack rather than copied verbatim - in llm-sc-1 the STT,
  # TTS and image endpoints point at services that do not exist here. Here:
  #   LLM    -> vllm      (Ling-3.0-flash, same network, no host gateway needed)
  #   search -> searxng   (already in this stack)
  #   STT/TTS-> speaches  (already in this stack: Whisper + Kokoro)
  # Image generation is intentionally absent - there is no imagegen service in
  # this stack, and starting one would want GPU memory Ling is holding.
  #
  # !! SHARES THE LLM WITH LIVE PHONE CALLS !! A long prompt pasted here blocks
  # the call path: measured, a 244K-token request kept a trivial request queued
  # for 679 s while sip-agent's LLM_AGENT_TIMEOUT_S is 30. Keep documents small
  # or expect dropped calls. See ~/code-llm/ling-fp4/README.md.
  # ============================================================================
  # Apache Tika - document text extraction (PDF, DOCX, PPTX...) for RAG.
  # The cloned config has CONTENT_EXTRACTION_ENGINE=tika, so without this
  # service every document upload fails to extract. CPU-only, no GPU.
  tika:
    image: apache/tika:3.1.0.0
    container_name: tika
    restart: unless-stopped
    ports:
      - "127.0.0.1:9998:9998"
    deploy:
      resources:
        limits:
          memory: 2G
    healthcheck:
      test: ["CMD", "bash", "-c", "(echo > /dev/tcp/localhost/9998) 2>/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    depends_on:
      vllm:
        condition: service_healthy
      searxng:
        condition: service_started
      tika:
        condition: service_started
    ports:
      # Default 3000: sip-agent already publishes host :${API_PORT:-8080}.
      - "${OPEN_WEBUI_PORT:-3000}:8080"
    # The embedding server (code-llm-embed, :8002) lives in the SEPARATE
    # `code-llm` compose project, so its container name does not resolve on
    # this project's network. Reach it through the host's published port.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - open-webui:/app/backend/data
      # Reranker/embedding models are already in the host cache; without this
      # the container re-downloads them on first RAG use.
      - ~/.cache/huggingface:/hf-cache
    environment:
      # =====================================================================
      # CONFIG PARITY WITH ~/llm-sc-1 (restored 2026-08-09)
      #
      # This service was cloned from llm-sc-1 on 2026-08-08 but only the LLM /
      # search / voice wiring came across - the auth, hardening, RAG and UI
      # settings did not. They are restored here. Anything that pointed at a
      # service llm-sc-1 has and this stack does not (imagegen/FLUX, chatterbox
      # TTS, open-terminal) is deliberately still absent; everything else now
      # matches, with this stack's endpoints substituted.
      #
      # ENABLE_PERSISTENT_CONFIG=False is what makes the rest of this block
      # actually apply. With it True (the default) Open WebUI persists config in
      # webui.db on first boot and the stored value wins forever after, so edits
      # here would be silently ignored on an existing volume - which is exactly
      # why this instance drifted. The trade: Admin Settings changes made in the
      # UI no longer survive a restart. Change settings HERE, not in the UI.
      # =====================================================================

      # ---- General -----------------------------------------------------------
      - WEBUI_NAME=Cha0s AI
      - WEBUI_DESCRIPTION=An AI assistant for hackers, built with open-source models and tools.
      - WEBUI_THEME=dark
      - "RESPONSE_WATERMARK=— Cha0s AI"
      - WEBUI_URL=${WEBUI_URL:-https://cha0s.ai}
      - WEBUI_PORT=8080
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}
      # WEBHOOK_URL is deliberately NOT set, though llm-sc-1 sets it to
      # https://cha0s.ai/webhook. It is meant to point at an external notifier
      # (Slack/Discord/n8n); Open WebUI has no /webhook route of its own, so
      # that value made it POST to itself and log a 405 traceback on every
      # notification event. Verified here 2026-08-09 before removing it. Point
      # it at http://n8n:5678/webhook/<id> if outbound notifications are wanted.
      - ENABLE_PERSISTENT_CONFIG=False
      - ENABLE_REALTIME_CHAT_SAVE=True
      - ENABLE_TELEMETRY=False
      - LOG_LEVEL=info
      - GLOBAL_LOG_LEVEL=info
      - ENABLE_AUDIT_STDOUT=True
      - AUDIT_LOG_LEVEL=REQUEST_RESPONSE

      # ---- Auth: Entra ID SSO only -------------------------------------------
      # cha0s.ai is internet-reachable (Cloudflare -> this box), so the previous
      # state - password login on, open signup - let anyone who found the
      # hostname create an account. All five existing users in webui.db are
      # already linked to the `microsoft` OAuth provider, including the admin,
      # so turning the password form off does not lock anyone out.
      # IF SSO EVER BREAKS: set ENABLE_LOGIN_FORM/ENABLE_PASSWORD_AUTH back to
      # true here and `docker compose up -d open-webui` to get the form back.
      - ENABLE_LOGIN_FORM=false
      - ENABLE_PASSWORD_AUTH=false
      - ENABLE_SIGNUP=False
      - DEFAULT_USER_ROLE=user
      - MICROSOFT_CLIENT_ID=${MICROSOFT_CLIENT_ID}
      - MICROSOFT_CLIENT_SECRET=${MICROSOFT_CLIENT_SECRET}
      - MICROSOFT_CLIENT_TENANT_ID=${MICROSOFT_CLIENT_TENANT_ID}
      - OPENID_PROVIDER_URL=https://login.microsoftonline.com/${MICROSOFT_CLIENT_TENANT_ID}/v2.0/.well-known/openid-configuration
      - MICROSOFT_OAUTH_SCOPE=openid email profile offline_access
      - ENABLE_OAUTH_SIGNUP=true
      # Entra app roles -> Open WebUI roles
      - ENABLE_OAUTH_ROLE_MANAGEMENT=true
      - OAUTH_ROLES_CLAIM=roles
      - OAUTH_ADMIN_ROLES=admin
      - OAUTH_ALLOWED_ROLES=user,admin
      # Entra groups -> Open WebUI groups
      - ENABLE_OAUTH_GROUP_MANAGEMENT=true
      - OAUTH_GROUP_CLAIM=groups
      - ENABLE_OAUTH_GROUP_CREATION=true
      - OAUTH_GROUP_DEFAULT_SHARE=members

      # ---- Security: cookies, CORS, tokens -----------------------------------
      # Secure=True is correct now that the entry point is HTTPS at cha0s.ai. It
      # does mean a browser hitting http://10.42.252.10:8080 directly will not
      # store the session cookie, so LAN logins must go through the public name.
      - WEBUI_SESSION_COOKIE_SECURE=True
      - WEBUI_AUTH_COOKIE_SECURE=True
      - WEBUI_SESSION_COOKIE_SAME_SITE=lax
      - JWT_EXPIRES_IN=1h
      # llm-sc-1 listed the LAN origin without a port, which can never match a
      # browser request to :8080; the port is added here.
      - CORS_ALLOW_ORIGIN=https://cha0s.ai;http://10.42.252.10:8080
      - BYPASS_MODEL_ACCESS_CONTROL=False
      - ENABLE_API_KEYS=True

      # ---- LLM: the same Ling container the phone bot uses -------------------
      # llm-sc-1 pointed at its own gemma4 vLLM on :8888; here it is this
      # stack's SGLang/Ling on the compose network.
      - ENABLE_OPENAI_API=True
      - ENABLE_OLLAMA_API=False
      - OPENAI_API_BASE_URL=http://vllm:8000/v1
      - OPENAI_API_KEY=not-needed
      - AIOHTTP_CLIENT_TIMEOUT=600
      # llm-sc-1's three model knobs all named gemma-4-26b, which does not exist
      # in this stack. ling-3.0-flash is the only served model here.
      - DEFAULT_MODELS=${LLM_MODEL:-ling-3.0-flash}
      - DEFAULT_PINNED_MODELS=${LLM_MODEL:-ling-3.0-flash}
      - TASK_MODEL_EXTERNAL=${LLM_MODEL:-ling-3.0-flash}
      - ENABLE_CHANNELS=True
      - ENABLE_EVALUATION_ARENA_MODELS=False
      - ENABLE_EVALUATION_ARENA_USER_CHALLENGES=False
      - ENABLE_CHAT_RESPONSE_BASE64_IMAGE_URL_CONVERSION=True
      - ENABLE_CHAT_RESPONSE_BASE64_AUDIO_URL_CONVERSION=True

      # ---- Workspace sharing permissions -------------------------------------
      - USER_PERMISSIONS_WORKSPACE_MODELS_ALLOW_SHARING=True
      - USER_PERMISSIONS_WORKSPACE_KNOWLEDGE_ALLOW_SHARING=True
      - USER_PERMISSIONS_WORKSPACE_PROMPTS_ALLOW_SHARING=True
      - USER_PERMISSIONS_WORKSPACE_SKILLS_ALLOW_SHARING=True
      - USER_PERMISSIONS_WORKSPACE_TOOLS_ALLOW_SHARING=True

      # ---- Web search: searxng in this stack ---------------------------------
      # Result count / concurrency stay at this stack's tuned values (llm-sc-1
      # used 15 results and no concurrency settings); 0 concurrency serialised
      # the search step.
      - ENABLE_WEB_SEARCH=True
      - WEB_SEARCH_ENGINE=searxng
      - SEARXNG_QUERY_URL=http://searxng:8080/search?q=<query>&format=json
      - SEARXNG_LANGUAGE=en
      - WEB_SEARCH_RESULT_COUNT=30
      - WEB_SEARCH_CONCURRENT_REQUESTS=10
      - BYPASS_WEB_SEARCH_EMBEDDING_AND_RETRIEVAL=False
      - WEB_FETCH_MAX_CONTENT_LENGTH=50000
      # Page fetching: 30 results is only useful if the pages are fetched in
      # parallel and slow sites time out instead of blocking the batch.
      - WEB_LOADER_CONCURRENT_REQUESTS=15
      - WEB_LOADER_TIMEOUT=20
      - ENABLE_WEB_LOADER_SSL_VERIFICATION=True
      - ENABLE_RAG_LOCAL_WEB_FETCH=True

      # ---- RAG / retrieval ---------------------------------------------------
      # Chunking and RAG_SYSTEM_CONTEXT come from llm-sc-1. top_k stays at this
      # stack's wider 20/10 rather than llm-sc-1's 5 - with hybrid search and a
      # reranker in front, a narrow top_k was the real limiter on how much of a
      # 30-site web search ever reached the model.
      - RAG_SYSTEM_CONTEXT=True
      - CHUNK_SIZE=1500
      - CHUNK_OVERLAP=200
      - ENABLE_RAG_HYBRID_SEARCH=True
      - RAG_TOP_K=20
      - RAG_TOP_K_RERANKER=10
      - RAG_RELEVANCE_THRESHOLD=0.0
      - RAG_RERANKING_MODEL=cross-encoder/ms-marco-MiniLM-L-6-v2

      # ---- Embeddings: Qwen3-Embedding-4B @ 1024-d (added 2026-08-11) --------
      # Was the built-in sentence-transformers engine running
      # sentence-transformers/all-MiniLM-L6-v2 (384-d) on the Grace cores
      # inside this container. Now offloaded to the GPU-backed vLLM pooling
      # server in the `code-llm` project (container code-llm-embed, host
      # :8002, served as `qwen3-embed`). That server pins output width to 1024
      # via --pooler-config, which matters here because Open WebUI's
      # generate_openai_batch_embeddings posts only {input, model} and never
      # sends a `dimensions` field - the width has to be a server-side default.
      #
      # !! DIMENSION CHANGE: 384 -> 1024 !! Every collection already in
      # /app/backend/data/vector_db was written by MiniLM and is now both the
      # wrong width AND the wrong vector space. Old documents must be
      # re-uploaded/re-indexed; new ones are fine. Nothing re-embeds itself.
      #
      # NOT set deliberately: RAG_EMBEDDING_QUERY_PREFIX /
      # RAG_EMBEDDING_CONTENT_PREFIX. Qwen3-Embedding does support instruction
      # prefixes, but Open WebUI ships them as an extra JSON field named by
      # RAG_EMBEDDING_PREFIX_FIELD_NAME, which vLLM's embeddings endpoint does
      # not accept. Leaving them unset costs a little retrieval quality and
      # keeps the requests valid.
      - RAG_EMBEDDING_ENGINE=openai
      - RAG_EMBEDDING_MODEL=qwen3-embed
      - RAG_OPENAI_API_BASE_URL=http://host.docker.internal:8002/v1
      - RAG_OPENAI_API_KEY=not-needed
      # Default is 1 - one HTTP round trip per chunk, which makes indexing a
      # large document painfully serial. 16 matches the server's --max-num-seqs.
      - RAG_EMBEDDING_BATCH_SIZE=16

      # ---- Document extraction ----------------------------------------------
      - CONTENT_EXTRACTION_ENGINE=tika
      - TIKA_SERVER_URL=http://tika:9998
      - PDF_EXTRACT_IMAGES=True

      # ---- Voice: speaches in this stack -------------------------------------
      # llm-sc-1 used a separate faster-whisper-server and chatterbox TTS; both
      # roles are filled by `speaches` here.
      - AUDIO_STT_ENGINE=openai
      - AUDIO_STT_OPENAI_API_BASE_URL=http://speaches:8001/v1
      - AUDIO_STT_OPENAI_API_KEY=not-needed
      - AUDIO_STT_MODEL=${WHISPER_MODEL:-Systran/faster-distil-whisper-small.en}
      - AUDIO_TTS_ENGINE=openai
      - AUDIO_TTS_OPENAI_API_BASE_URL=http://speaches:8001/v1
      - AUDIO_TTS_OPENAI_API_KEY=not-needed
      - AUDIO_TTS_MODEL=${TTS_MODEL:-speaches-ai/Kokoro-82M-v1.0-ONNX}
      - AUDIO_TTS_VOICE=${TTS_VOICE:-af_heart}

      # ---- RAG model cache ---------------------------------------------------
      - HF_HOME=/hf-cache
      - SENTENCE_TRANSFORMERS_HOME=/hf-cache

